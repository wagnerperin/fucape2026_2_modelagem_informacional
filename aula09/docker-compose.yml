# =============================================================================
# FUCAPE Business School - Ciência de Dados para Negócios
# Disciplina: Modelagem Informacional
# Aula 09: Laboratório Prático Imersivo de Engenharia de Dados
# -----------------------------------------------------------------------------
# ARQUIVO: docker-compose.yml
# Propósito: Cluster analítico conteinerizado com Apache Airflow 2.8.1 e
#            PostgreSQL 16 Data Warehouse para orquestração e modelagem ELT.
#
# Comandos Essenciais do Terminal:
#   docker compose up -d       (Sobe o cluster em segundo plano)
#   docker compose ps          (Lista o status de saúde dos contêineres)
#   docker compose logs -f     (Rastreia os logs de execução)
#   docker compose down        (Encerra todos os serviços liberando RAM/CPU)
#
# Acesso Web UI do Airflow:
#   URL: http://localhost:8080
#   Credenciais: admin / admin
# =============================================================================

version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1-python3.10
  environment:
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_dw:5432/airflow_metadata
    - AIRFLOW__WEBSERVER__SECRET_KEY=fucape_secret_key_aula09_modelagem_informacional
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./bronze_transacoes_raw.jsonl:/opt/airflow/bronze_transacoes_raw.jsonl
    - ./finpay_analitico.db:/opt/airflow/finpay_analitico.db
    - ./ingestao_resiliente_api.py:/opt/airflow/ingestao_resiliente_api.py
    - ./simulador_api_parceira.py:/opt/airflow/simulador_api_parceira.py
    - ./executar_pipeline_dbt.py:/opt/airflow/executar_pipeline_dbt.py
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres_dw:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL 16 (Metadados do Airflow e Data Warehouse)
  # ---------------------------------------------------------------------------
  postgres_dw:
    image: postgres:16-alpine
    container_name: finpay_postgres_dw
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------------------
  # 2. Inicializador do Banco e Criação do Usuário Administrador (admin / admin)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: finpay_airflow_init
    command: version
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      postgres_dw:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Apache Airflow Standalone (Webserver + Scheduler + Triggers Integrados)
  # ---------------------------------------------------------------------------
  airflow-standalone:
    <<: *airflow-common
    container_name: finpay_airflow_standalone
    command: standalone
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres_dw_data:
    name: finpay_postgres_dw_data
