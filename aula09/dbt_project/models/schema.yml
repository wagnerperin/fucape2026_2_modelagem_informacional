# Disciplina: Modelagem Informacional
# Aula 09: Laboratório Prático Imersivo de Engenharia de Dados
# -----------------------------------------------------------------------------
# ARQUIVO: models/schema.yml
# ESPECIFICAÇÃO DE TESTES DECLARATIVOS DE QUALIDADE DE DADOS (12 CONTRATOS)
# =============================================================================
version: 2

models:
  - name: stg_finpay_transacoes
    description: "Camada Staging: padronização, cast monetário e desaninhamento da camada Raw."
    columns:
      - name: id_transacao
        description: "Chave primária natural da transação."
        tests:
          - unique
          - not_null

  - name: dim_lojistas
    description: "Tabela Dimensão Conforme contendo os lojistas parceiros credenciados na FinPay."
    columns:
      - name: id_lojista
        description: "Identificador único do lojista credenciado."
        tests:
          - unique
          - not_null

      - name: categoria
        description: "Segmento de mercado oficial do estabelecimento comercial credenciado."
        tests:
          - accepted_values:
              values: ['ELETRONICOS', 'MODA', 'AUTOPECAS', 'ALIMENTACAO', 'DECORACAO']

  - name: fct_liquidacoes_diarias
    description: "Tabela Fato contendo as liquidações financeiras aprovadas com aplicação da taxa MDR."
    columns:
      - name: id_transacao
        description: "Chave primária da liquidação gerada."
        tests:
          - unique
          - not_null

      - name: vlr_liquido_lojista
        description: "Valor líquido final creditado na conta do lojista parceiro."
        tests:
          - not_null

      - name: id_lojista
        description: "Chave estrangeira apontando para a dimensão conforme de lojistas credenciados."
        tests:
          - not_null
          - relationships:
              to: ref('dim_lojistas')
              field: id_lojista

      - name: vlr_transacao_brl
        description: "Volume bruto da autorização financeira em reais (deve ser estritamente positivo)."
        tests:
          - positive_values

      - name: vlr_taxa_mdr_finpay
        description: "Receita de taxa MDR da FinPay em reais (deve ser estritamente positiva)."
        tests:
          - positive_values
