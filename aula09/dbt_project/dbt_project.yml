name: 'finpay_analytics'
version: '1.0.0'
config-version: 2

# Perfil de conexão do Data Warehouse
profile: 'finpay_dw'

# Estrutura de diretórios do projeto dbt
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configurações de materialização por camada lógica (Analytics Engineering)
models:
  finpay_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
