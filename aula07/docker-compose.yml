# =============================================================================
# FUCAPE Business School - Ciência de Dados para Negócios
# Disciplina: Modelagem Informacional
# Aula 07: O Paradigma ETL vs. ELT e Ferramentas Modernas
# -----------------------------------------------------------------------------
# ARQUIVO: docker-compose.yml
# Propósito: Ambiente de infraestrutura corporativa sob demanda (Opcional).
#            Sobe Apache Airflow 2.8 Standalone e PostgreSQL 16 DW para
#            estudantes que desejam experimentar a interface Web de produção.
#
# Como rodar:
#   docker compose up -d
# Acessar Airflow Web UI:
#   http://localhost:8080 (usuário padrão criado: admin / admin)
# =============================================================================

version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1-python3.10
  environment:
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_dw:5432/airflow_metadata
    - AIRFLOW__WEBSERVER__SECRET_KEY=fucape_secret_key_aula07_modelagem_informacional
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./bronze_transacoes_raw.jsonl:/opt/airflow/bronze_transacoes_raw.jsonl
    - ./finpay_analitico.db:/opt/airflow/finpay_analitico.db
    - ./ingestao_resiliente_api.py:/opt/airflow/ingestao_resiliente_api.py
    - ./simulador_api_parceira.py:/opt/airflow/simulador_api_parceira.py
    - ./executar_pipeline_dbt.py:/opt/airflow/executar_pipeline_dbt.py
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres_dw:
      condition: service_healthy

services:
  # Banco de Dados PostgreSQL (Metadados do Airflow e Mock de Data Warehouse)
  postgres_dw:
    image: postgres:16-alpine
    container_name: finpay_postgres_dw
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # Inicializador do Banco de Dados do Airflow
  airflow-init:
    <<: *airflow-common
    container_name: finpay_airflow_init
    command: version
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      postgres_dw:
        condition: service_healthy

  # Apache Airflow Standalone (Webserver + Scheduler + Triggers integrados)
  airflow-standalone:
    <<: *airflow-common
    container_name: finpay_airflow_standalone
    command: standalone
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres_dw_data:
